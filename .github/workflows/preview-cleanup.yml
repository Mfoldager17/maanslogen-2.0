name: Preview-oprydning

# Dev-miljøet lever kun så længe PR'et er åbent. Kører også når et PR lukkes
# uden at blive merget.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  ryd-op:
    name: Fjern preview for PR ${{ github.event.pull_request.number }}
    # Samme betingelse som i preview.yml: blev miljøet aldrig oprettet, er der
    # heller intet at fjerne.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, maanslogen-pi]
    steps:
      - uses: actions/checkout@v4

      # Begge trin kører uanset om det foregående fejlede. En container der
      # ikke kunne fjernes må ikke efterlade et DNS-navn der peger i tomme
      # luften — og omvendt.
      - name: Stop containeren
        if: always()
        run: infra/pi/preview.sh down "${{ github.event.pull_request.number }}"

      - name: Fjern DNS-navnet
        if: always()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: infra/scripts/dns-record.sh delete "api-pr-${{ github.event.pull_request.number }}.${{ vars.DEV_DOMAIN }}"

      # Worker-versionen har ingen oprydning: `versions upload` udruller ikke
      # noget, og gamle versioner falder af sig selv ud. Aliaset pr-<nummer>
      # bliver genbrugt næste gang det samme nummer dukker op.
      - name: Skriv at miljøet er væk
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const markør = '<!-- maanslogen-preview -->';
            const { data: kommentarer } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const eksisterende = kommentarer.find((k) => k.body.includes(markør));
            if (!eksisterende) return;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: eksisterende.id,
              body: [
                markør,
                '### Preview',
                '',
                'Miljøet er fjernet — PR\'et er lukket.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
