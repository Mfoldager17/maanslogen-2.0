name: Nulstil dev-databasen

# Dev-databasen deles af alle previews og af lokal udvikling, så den samler
# skrald: halve anmeldelser, testbrugere, en migrering fra et PR der aldrig
# blev merget. Det her er knappen der giver den rene testdata tilbage.
on:
  workflow_dispatch:
    inputs:
      bekræft:
        description: Skriv "nulstil" for at bekræfte. Alt i dev-databasen slettes.
        required: true

permissions:
  contents: read

jobs:
  nulstil:
    name: Dan dev-databasen på ny
    if: github.event.inputs.bekræft == 'nulstil'
    runs-on: [self-hosted, maanslogen-pi]
    steps:
      - uses: actions/checkout@v4

      - name: Smid skemaet væk og seed forfra
        working-directory: infra/pi
        run: |
          set -a; . ./.env; set +a
          url="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/maanslogen_dev?schema=public"

          # To trin, ikke ét. Prisma 6's `migrate reset` kørte seed-scriptet
          # til sidst; Prisma 7 gør det ikke, og den siger ikke fra — den
          # melder "Database reset successful" og efterlader en tom database.
          # Kontrolleret mod en rigtig Postgres: 0 rækker i beverages, users
          # og reviews bagefter. Derfor kaldes `db seed` udtrykkeligt.
          docker run --rm --network maanslogen -e DATABASE_URL="$url" \
            maanslogen-api:dev ./node_modules/.bin/prisma migrate reset --force

          docker run --rm --network maanslogen -e DATABASE_URL="$url" \
            maanslogen-api:dev ./node_modules/.bin/prisma db seed

      - name: Tjek at der faktisk er testdata
        working-directory: infra/pi
        run: |
          set -a; . ./.env; set +a
          antal=$(docker compose exec -T postgres psql -qtAX \
            -U "$POSTGRES_USER" -d maanslogen_dev -c 'SELECT count(*) FROM beverages')
          echo "drikkevarer i dev-databasen: $antal"
          # En tom database her betyder at seed'en fejlede uden at sige det.
          [ "$antal" -gt 0 ] || { echo 'dev-databasen er tom efter seed' >&2; exit 1; }
