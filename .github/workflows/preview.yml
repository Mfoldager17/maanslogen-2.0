name: Preview

# Et dev-miljø findes kun så længe der er et åbent PR. Det består af en
# Worker-version til web og en container på Pi'en til API'et; begge mod den
# fælles dev-database.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# En selvhostet runner kører workflow-kode på Pi'en derhjemme, og repoet er
# offentligt: hvem som helst kan forke og åbne et PR. Betingelsen herunder er
# det eneste der står mellem en fremmed og maskinen, så den står direkte på
# hvert job frem for at gå gennem et hjælpejob.
#
# `head.repo.full_name == github.repository` er sandt kun når grenen ligger i
# repoet selv, hvilket kræver push-adgang. En fork har et andet navn.
#
# Tidligere blev tjekket lavet i et `guard`-job, der skrev true/false til en
# output-variabel. To ting var skidt ved det: værdien fra forespørgslen blev
# interpoleret ind i en shell-kommando, og hele beskyttelsen afhang af at det
# job kørte færdigt. Nu afviser GitHub selv jobbet, før der tildeles en runner.
jobs:
  api:
    name: API-preview på Pi'en
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, maanslogen-pi]
    steps:
      - uses: actions/checkout@v4

      - name: Byg API-imaget
        run: docker build -f apps/api/Dockerfile -t maanslogen-api:pr-${{ github.event.pull_request.number }} .

      - name: Start containeren
        run: |
          infra/pi/preview.sh up \
            "${{ github.event.pull_request.number }}" \
            "https://pr-${{ github.event.pull_request.number }}-${{ vars.WORKER_NAME }}.${{ vars.WORKERS_SUBDOMAIN }}"

      - name: Læg DNS-navnet op
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
          NAVN: api-pr-${{ github.event.pull_request.number }}.${{ vars.DEV_DOMAIN }}
        run: infra/scripts/dns-record.sh upsert "$NAVN"

  web:
    name: Web-preview på Workers
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maanslogen/contracts build

      # API'ets adresse bages ind i bundlen, så den skal sættes her og ikke
      # som en binding på Workeren. Begge adresser kan regnes ud på forhånd,
      # så web og API ikke skal vente på hinanden.
      - name: Byg til Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api-pr-${{ github.event.pull_request.number }}.${{ vars.DEV_DOMAIN }}
          NEXT_PUBLIC_MEDIA_URL: https://${{ vars.DEV_MEDIA_HOST }}
        run: pnpm cf:build

      # `versions upload` lægger en ny version op med sin egen URL uden at
      # røre den udrullede version. Der er derfor ingen Worker at rydde op i
      # bagefter — kun DNS-navnet og containeren på Pi'en.
      - name: Læg versionen op
        id: upload
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.head.sha }}"
          echo "url=https://pr-${{ github.event.pull_request.number }}-${{ vars.WORKER_NAME }}.${{ vars.WORKERS_SUBDOMAIN }}" >> "$GITHUB_OUTPUT"

  kommentar:
    name: Skriv adresserne på PR'et
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          WEB_URL: ${{ needs.web.outputs.url }}
          API_URL: https://api-pr-${{ github.event.pull_request.number }}.${{ vars.DEV_DOMAIN }}
        with:
          script: |
            const markør = '<!-- maanslogen-preview -->';
            const brødtekst = [
              markør,
              '### Preview',
              '',
              `| | |`,
              `| --- | --- |`,
              `| Site | ${process.env.WEB_URL} |`,
              `| API | ${process.env.API_URL} |`,
              `| API-dokumentation | ${process.env.API_URL}/docs |`,
              '',
              'Kører mod den **fælles dev-database** med testdata — den samme som',
              'alle andre previews og lokal udvikling. Ændringer her er synlige',
              'for alle, og en migrering i dette PR er allerede kørt på den.',
              '',
              'Miljøet forsvinder når PR\'et lukkes.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: kommentarer } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const eksisterende = kommentarer.find((k) => k.body.includes(markør));
            if (eksisterende) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: eksisterende.id, body: brødtekst,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: brødtekst,
              });
            }
