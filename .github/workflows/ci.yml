name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Testdatabasen kører som service herunder.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maanslogen_test?schema=public

jobs:
  verify:
    name: Typecheck, lint og test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maanslogen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installér afhængigheder
        run: pnpm install --frozen-lockfile

      - name: Byg delte kontrakter
        run: pnpm --filter @maanslogen/contracts build

      - name: Kør migreringer mod testdatabasen
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Lint
        run: pnpm turbo run lint

      - name: Formatering
        run: pnpm format:check

      - name: Unit-tests
        run: pnpm turbo run test

      - name: E2E mod en rigtig Postgres
        working-directory: apps/api
        run: pnpm test:e2e

      - name: Byg alt
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

  docker:
    name: Docker-images kan bygges
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: API-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
