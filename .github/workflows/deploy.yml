name: Udrul

# Lægger et nyt :main-image i GHCR. Pi'en opdager det selv inden for et par
# minutter, migrerer og genstarter — se infra/pi/agent/.
#
# Der er ingen selvhostet runner. Intet her har adgang til Pi'en, og Pi'en har
# ingen skriverettigheder nogen steder.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produktion
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: API-image til GHCR
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Byg og læg op
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/maanslogen-api:main
            ghcr.io/${{ github.repository_owner }}/maanslogen-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    name: Web på Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maanslogen/contracts build

      - name: Byg til Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.PROD_API_HOST }}
          NEXT_PUBLIC_MEDIA_URL: https://${{ vars.PROD_MEDIA_HOST }}
        run: pnpm cf:build

      - name: Udrul
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
