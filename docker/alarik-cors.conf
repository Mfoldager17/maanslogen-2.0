# CORS for de presignede uploads. Se kommentaren ved `s3`-servicen i
# docker-compose.yml for hvorfor denne skal findes.
#
# Produktionens modstykke er R2-bucketens egen CORS-regel; listen af headere
# nedenfor skal holdes i sync med den, ellers rammer vi kun fejlen ét af
# stederne.

# Tom streng for alt andet end vores egne origins. nginx udelader en header
# hvis dens værdi er tom, så en ukendt origin får slet ingen ACAO — ikke en
# forkert en.
map $http_origin $mlg_cors_origin {
    default                  "";
    "http://localhost:3000"  $http_origin;
    "http://127.0.0.1:3000"  $http_origin;
}

server {
    listen 80;

    # Et 4000 px billede skaleres i browseren før upload, men der er ingen
    # grund til at sætte et kunstigt loft her.
    client_max_body_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        # Preflight besvares her og når aldrig Alarik. Ellers ville Alariks
        # eget CORS-filter svare med sin faste headerliste — uden
        # `cache-control` — og browseren ville blokere uploaden.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $mlg_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, content-type, cache-control, x-amz-content-sha256, x-amz-date, x-amz-acl, x-amz-checksum-crc32, x-amz-sdk-checksum-algorithm, amz-sdk-invocation-id, amz-sdk-request" always;
            add_header Access-Control-Max-Age       600 always;
            add_header Content-Length               0;
            return 204;
        }

        # Alarik sætter selv en ACAO på svar der har en Origin — tom, når
        # origin ikke matcher dens CONSOLE_BASE_URL. To ACAO-headere på samme
        # svar afviser browseren, så dens fjernes før vores sættes.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        add_header Access-Control-Allow-Origin   $mlg_cors_origin always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Type" always;

        proxy_pass http://alarik:8080;

        # `$http_host`, ikke `$host`: SigV4 signerer den nøjagtige Host-header
        # klienten sendte, og den indeholder porten ("localhost:9000").
        # `$host` smider porten væk, og så fejler signaturvalideringen.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
