# Lokal infrastruktur: PostgreSQL og MinIO.
#
# MinIO taler samme S3-API som Cloudflare R2, så API'et kører med præcis den
# samme kode lokalt og i produktion — kun STORAGE_DRIVER og nøglerne skifter.

name: maanslogen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maanslogen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maanslogen"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-API
      - "9001:9001"   # Konsol
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opretter bucketen og gør den offentligt læsbar, så billed-URL'er virker
  # ligesom et R2-bucket med et offentligt domæne foran.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/maanslogen-dev &&
      mc anonymous set download local/maanslogen-dev &&
      mc mb --ignore-existing local/maanslogen-test &&
      mc anonymous set download local/maanslogen-test &&
      echo 'Buckets klar.'
      "

volumes:
  postgres-data:
  minio-data:
