# Lokal infrastruktur: PostgreSQL og MinIO.
#
# MinIO taler samme S3-API som Cloudflare R2, så API'et kører med præcis den
# samme kode lokalt og i produktion — kun STORAGE_DRIVER og nøglerne skifter.
#
# Images hentes fra quay.io og ikke Docker Hub. MinIO slettede minio/minio og
# minio/mc fra Docker Hub den 11. september 2026, og et `docker compose up`
# fejler derfor med "pull access denied ... repository does not exist".
#
# Tags er låst fast. quay.io serverer stadig de gamle udgaver, men de er
# frosne — sidste frie udgivelse er fra september 2025 — så `latest` er ikke
# noget at regne med her. Til en lokal udviklingsopsætning er det fint; det er
# produktionen der kører på R2.

name: maanslogen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maanslogen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maanslogen"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-API
      - "9001:9001"   # Konsol
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opretter bucketen og gør den offentligt læsbar, så billed-URL'er virker
  # ligesom et R2-bucket med et offentligt domæne foran.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/maanslogen-dev &&
      mc anonymous set download local/maanslogen-dev &&
      mc mb --ignore-existing local/maanslogen-test &&
      mc anonymous set download local/maanslogen-test &&
      echo 'Buckets klar.'
      "

volumes:
  postgres-data:
  minio-data:
