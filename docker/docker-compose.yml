# Lokal infrastruktur: PostgreSQL og en S3-server.
#
# S3-serveren taler samme API som Cloudflare R2, så API'et kører med præcis den
# samme kode lokalt og i produktion — kun STORAGE_DRIVER og nøglerne skifter.
#
# Her stod MinIO indtil september 2026, hvor MinIO slettede minio/minio og
# minio/mc fra Docker Hub. quay.io holdt heller ikke: de tags der findes
# omtalt, svarer 401 på manifestet.
#
# Valget faldt på LocalStack frem for adobe/s3mock, som ellers er en femtedel
# så stor. Grunden er presignede URL'er. s3mock skriver selv at den tager imod
# dem uden at validere signatur, udløb eller HTTP-verbum — og hele vores
# upload-sti hviler på netop dem. En fejl i vores presign ville altså virke
# lokalt og først vise sig mod R2. Det er den slags fejl der er dyrest.
#
# LocalStack lytter på 4566 indeni, men udstilles på 9000 udadtil, så
# .env-filer, tests og next.config kan blive som de er.

name: maanslogen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maanslogen
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maanslogen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bemærk: gratisudgaven gemmer ikke data på tværs af `infra:down`. Det er
  # til at leve med her — seeden opretter ingen billeder, så det eneste der
  # går tabt, er hvad du selv har uploadet mens du testede.
  s3:
    image: localstack/localstack:2026.08.4
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEBUG: "0"
      # Nøglerne er vilkårlige, men skal matche apps/api/.env.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "9000:4566"
    volumes:
      # Scriptet køres når LocalStack melder sig klar, og opretter de to
      # buckets. Derfor er der ingen init-container mere.
      - ./localstack-buckets.sh:/etc/localstack/init/ready.d/buckets.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
