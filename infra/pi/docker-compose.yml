# Alt der kører på Pi'en. Bringes op med:
#   docker compose --env-file .env up -d
#
# Preview-containere startes ikke herfra. Agenten (infra/pi/agent/) opretter dem
# ud fra hvilke PR'er der har label'en "preview", og hægter dem på
# maanslogen-dev-netværket.

name: maanslogen

networks:
  # To netværk, så en preview-container ikke kan nå produktions-API'et.
  # Postgres og Caddy er med i begge; produktions-API'et kun i det første.
  maanslogen:
    name: maanslogen
  maanslogen-dev:
    name: maanslogen-dev

volumes:
  postgres-data:
  caddy-data:

services:
  # ---- Database ----------------------------------------------------------
  # Én instans, to databaser: maanslogen (produktion) og maanslogen_dev
  # (testdata). Begge oprettes af init-scriptet første gang volumen er tom.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: maanslogen
      # Bruges af init-scriptet til at oprette dev-rollen.
      DEV_POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-dev-db.sh:/docker-entrypoint-initdb.d/10-init-dev-db.sh:ro
    networks: [maanslogen, maanslogen-dev]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d maanslogen']
      interval: 10s
      timeout: 5s
      retries: 5
    # Databasen er kun nåelig inde på docker-netværket. Ingen port publiceres:
    # skal du bruge psql udefra, så gå gennem `docker compose exec postgres`.

  # ---- API i produktion --------------------------------------------------
  api:
    image: ${GHCR_IMAGE:-ghcr.io/mfoldager17/maanslogen-api}:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/maanslogen?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${PROD_WEB_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_URL}
      ENABLE_SWAGGER: 'false'
    networks: [maanslogen]

  # ---- Delt dev-API ------------------------------------------------------
  # Kører main-grenens kode mod dev-databasen. Det er den et lokalt `pnpm
  # dev:remote` peger på. PR-previews får deres egen container ved siden af.
  api-dev:
    image: ${GHCR_IMAGE:-ghcr.io/mfoldager17/maanslogen-api}:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://maanslogen_dev:${DEV_POSTGRES_PASSWORD}@postgres:5432/maanslogen_dev?schema=public
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET}
      # Previews ligger på skiftende workers.dev-adresser, og en lokal
      # udvikler kommer fra localhost. Begge skal kunne kalde med cookies.
      CORS_ORIGINS: ${DEV_CORS_ORIGINS}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_DEV_BUCKET}
      R2_PUBLIC_BASE_URL: ${DEV_MEDIA_PUBLIC_URL}
      ENABLE_SWAGGER: 'true'
    networks: [maanslogen-dev]

  # ---- Router ------------------------------------------------------------
  # Fordeler på Host-headeren. Den findes for preview-containernes skyld:
  # uden den skulle tunnelens konfiguration skrives om og genstartes for hver
  # PR. Med den rører hverken tunnel eller DNS-opsætning et PR.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddyfile'en slår værtsnavnene op med {$...}, og Caddy læser dem fra sit
    # eget miljø — ikke fra .env-filen compose bruger. Uden de to linjer bliver
    # host-matcherne tomme, og Caddy nægter at starte med "module value cannot
    # be null". Det ville tage hele routeren ned, ikke kun previews.
    environment:
      PROD_API_HOST: ${PROD_API_HOST}
      DEV_API_HOST: ${DEV_API_HOST}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [maanslogen, maanslogen-dev]

  # ---- Tunnel ------------------------------------------------------------
  # Ingen port åbnes i routeren, og Pi'ens IP-adresse bliver aldrig offentlig.
  # cloudflared skaber selv forbindelsen ud til Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [maanslogen]
