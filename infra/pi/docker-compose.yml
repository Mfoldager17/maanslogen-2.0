# Alt der kører på Pi'en. Bringes op med:
#   docker compose --env-file .env up -d
#
# Preview-containere startes ikke herfra. Agenten (infra/pi/agent/) opretter dem
# ud fra om et åbent PR har label'en "dev", og hægter dev-API'et på
# maanslogen-dev-netværket.

name: maanslogen

networks:
  # To netværk, så dev-API'et ikke kan nå produktionens database.
  # Postgres og Caddy er med i begge; produktions-API'et kun i det første.
  maanslogen:
    name: maanslogen
  maanslogen-dev:
    name: maanslogen-dev

volumes:
  postgres-data:
  caddy-data:

services:
  # ---- Database ----------------------------------------------------------
  # Én instans, to databaser: maanslogen (produktion) og maanslogen_dev
  # (testdata). Begge oprettes af init-scriptet første gang volumen er tom.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: maanslogen
      # Bruges af init-scriptet til at oprette dev-rollen.
      DEV_POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-dev-db.sh:/docker-entrypoint-initdb.d/10-init-dev-db.sh:ro
    networks: [maanslogen, maanslogen-dev]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d maanslogen']
      interval: 10s
      timeout: 5s
      retries: 5
    # Databasen er kun nåelig inde på docker-netværket. Ingen port publiceres:
    # skal du bruge psql udefra, så gå gennem `docker compose exec postgres`.

  # ---- API i produktion --------------------------------------------------
  api:
    # :prod flyttes kun af et release i GitHub — se .github/workflows/release.yml.
    # Et push til main rører den ikke; det går til api-staging nedenfor.
    image: ${GHCR_IMAGE:-ghcr.io/mfoldager17/maanslogen-api}:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/maanslogen?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${PROD_WEB_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_URL}
      ENABLE_SWAGGER: 'false'
    networks: [maanslogen]

  # ---- Delt dev-API ------------------------------------------------------
  # Kører main-grenens kode mod dev-databasen. Det er den et lokalt `pnpm
  # dev:remote` peger på. Det er det eneste dev-API — se docs/environments.md.
  api-dev:
    # Taggen sættes af agenten: `dev` når et PR har label'en `dev`, ellers
    # `main`. Skal-værdien her gælder når compose kaldes i hånden.
    image: ${GHCR_IMAGE:-ghcr.io/mfoldager17/maanslogen-api}:${API_DEV_TAG:-main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://maanslogen_dev:${DEV_POSTGRES_PASSWORD}@postgres:5432/maanslogen_dev?schema=public
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET}
      # Dev-siden ligger på et fast workers.dev-alias, og en lokal udvikler
      # kommer fra localhost. Begge skal kunne kalde med cookies.
      CORS_ORIGINS: ${DEV_CORS_ORIGINS}
      COOKIE_DOMAIN: ${DEV_COOKIE_DOMAIN}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_DEV_BUCKET}
      R2_PUBLIC_BASE_URL: ${DEV_MEDIA_PUBLIC_URL}
      ENABLE_SWAGGER: 'true'
    networks: [maanslogen-dev]

  # ---- Staging -----------------------------------------------------------
  # main-grenens kode. Følger :main, som push til main lægger op.
  #
  # Deler database og billedbucket med dev. Det er et bevidst valg: staging
  # findes for at køre main et rigtigt sted før et release, ikke for at have
  # sit eget datasæt. Derfor også de samme JWT-nøgler som dev — tokens
  # valideres mod brugerne i netop den database.
  api-staging:
    image: ${GHCR_IMAGE:-ghcr.io/mfoldager17/maanslogen-api}:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://maanslogen_dev:${DEV_POSTGRES_PASSWORD}@postgres:5432/maanslogen_dev?schema=public
      JWT_ACCESS_SECRET: ${DEV_JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${DEV_JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS}
      COOKIE_DOMAIN: ${STAGING_COOKIE_DOMAIN}
      STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_DEV_BUCKET}
      R2_PUBLIC_BASE_URL: ${DEV_MEDIA_PUBLIC_URL}
      ENABLE_SWAGGER: 'true'
    networks: [maanslogen-dev]

  # ---- Router ------------------------------------------------------------
  # Fordeler på Host-headeren, så produktion og dev kan dele én tunnel.
  # Tunnelen giver al trafik til Caddy og skal derfor hverken skrives om
  # eller genstartes, når dev-miljøet skifter hvilket PR det viser.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddyfile'en slår værtsnavnene op med {$...}, og Caddy læser dem fra sit
    # eget miljø — ikke fra .env-filen compose bruger. Uden de to linjer bliver
    # host-matcherne tomme, og Caddy nægter at starte med "module value cannot
    # be null". Det ville tage hele routeren ned — også produktionen.
    environment:
      PROD_API_HOST: ${PROD_API_HOST}
      STAGING_API_HOST: ${STAGING_API_HOST}
      DEV_API_HOST: ${DEV_API_HOST}
      DEPLOY_HOST: ${DEPLOY_HOST}
    # Webhook-modtageren kører på værten, ikke i en container. Uden dette
    # findes navnet host.docker.internal ikke på Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [maanslogen, maanslogen-dev]

  # ---- Tunnel ------------------------------------------------------------
  # Ingen port åbnes i routeren, og Pi'ens IP-adresse bliver aldrig offentlig.
  # cloudflared skaber selv forbindelsen ud til Cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [caddy]
    networks: [maanslogen]
